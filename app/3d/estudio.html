<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>AnabTech · Estúdio de vídeos</title>
<style>
@font-face{font-family:'Space Grotesk';font-weight:500;src:url(fonts/space-grotesk-latin-500-normal.woff2)}
@font-face{font-family:'Space Grotesk';font-weight:700;src:url(fonts/space-grotesk-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2)}
@font-face{font-family:Archivo;font-weight:700;src:url(fonts/archivo-latin-700-normal.woff2)}
html,body{margin:0;background:#0b0c0e;color:#fff;font-family:Inter,system-ui,sans-serif}
#cv{display:block;height:100vh;width:auto;margin:0 auto}
#st{position:fixed;left:12px;top:12px;font-size:13px;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:8px}
#lote{max-width:560px;margin:0 auto;padding:40px 22px;display:none}
#lote h1{font-family:'Space Grotesk',sans-serif;font-size:30px;letter-spacing:-.02em;margin:0 0 8px}#lote p{color:rgba(255,255,255,.7);line-height:1.5;font-size:15px}
#lote button{height:52px;padding:0 22px;border-radius:14px;border:0;background:#c8ff3d;color:#0b0c0e;font:700 16px Inter,sans-serif;cursor:pointer;margin-top:10px}
#lote button:disabled{opacity:.5}#lote pre{background:#17181b;border-radius:12px;padding:14px;font-size:13px;line-height:1.5;white-space:pre-wrap;max-height:46vh;overflow:auto;color:rgba(255,255,255,.8)}
#barra{height:8px;border-radius:4px;background:rgba(255,255,255,.14);margin:18px 0 6px;overflow:hidden}#barra i{display:block;height:100%;width:0;background:#c8ff3d}
body.lote #cv{height:46vh;margin-top:10px}body.lote #st{display:none}body.lote #lote{display:block}
</style></head>
<body><div id="lote"><h1>Estúdio de vídeos · AnabTech</h1>
<p>Esta página desenha os vídeos de execução com a placa de vídeo deste computador e salva os arquivos na pasta que você escolher. Deixe a aba aberta e em primeiro plano até terminar.</p>
<button id="ir" type="button">Escolher a pasta e começar</button>
<div id="barra"><i></i></div><p id="prog">Aguardando.</p><pre id="log"></pre></div>
<canvas id="cv" width="1080" height="1920"></canvas><div id="st">Carregando…</div>
<script src="mp4-muxer.js"></script>
<script src="conteudo.js"></script>
<script src="estudio.js"></script>
<script type="module">
import './viewer-pro.js';
const q = new URLSearchParams(location.search), st = document.getElementById('st'), cv = document.getElementById('cv');
const LOTE = q.get('lote') === '1';
/* ---------- lote: todos os exercícios, codificados aqui mesmo (WebCodecs) ---------- */
const ceder = () => new Promise(r => { const c = new MessageChannel(); c.port1.onmessage = () => r(); c.port2.postMessage(0); }); /* não sofre o freio que o setTimeout leva em aba de fundo */
async function gravar(slug, pasta, log) {
  const K = window.CONTEUDO[slug], api = await window.__studio(slug, { ss: +(q.get('ss') || 2), shadow: +(q.get('sombra') || 4096) });
  const Q = window.Estudio.criarQuadro(api, K, cv, q.get('tema') || 'claro'), N = Q.R.frames, fps = 30, br = +(q.get('br') || 6000) * 1000;
  let cfg = null; for (const codec of ['avc1.640032', 'avc1.64002A', 'avc1.4D0032', 'avc1.42E032']) { const c = { codec, width: 1080, height: 1920, bitrate: br, framerate: fps, latencyMode: 'quality', avc: { format: 'avc' } }; try { const r = await VideoEncoder.isConfigSupported(c); if (r.supported) { cfg = c; break; } } catch (e) {} }
  if (!cfg) throw new Error('Este navegador não codifica H.264. Use o Chrome ou o Edge.');
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: 1080, height: 1920, frameRate: fps }, fastStart: 'in-memory' });
  let erro = null; const enc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => { erro = e; } }); enc.configure(cfg);
  try { for (let i = 0; i < N; i++) { if (erro) throw erro; if (i % 30 === 0 && api.perdido()) throw new Error('a placa de vídeo reiniciou no meio do vídeo'); Q.desenhar(i / fps); const vf = new VideoFrame(cv, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) }); enc.encode(vf, { keyFrame: i % 60 === 0 }); vf.close();
    while (enc.encodeQueueSize > 6) await ceder(); if (i % 15 === 0) { document.getElementById('prog').textContent = `${slug}: quadro ${i + 1} de ${N}`; await ceder(); } }
  await enc.flush(); if (erro) throw erro; if (api.perdido()) throw new Error('a placa de vídeo reiniciou no meio do vídeo'); enc.close(); muxer.finalize(); } catch (e) { try { enc.close(); } catch (x) {} api.dispose(); throw e; }
  const mp4 = new Blob([muxer.target.buffer], { type: 'video/mp4' });
  Q.desenhar(window.Estudio.capaT(api, Q.R)); const capa = await new Promise(r => cv.toBlob(r, 'image/jpeg', .9));
  api.dispose();
  for (const [nome, blob] of [[slug + '.mp4', mp4], [slug + '.jpg', capa]]) { if (pasta) { const fh = await pasta.getFileHandle(nome, { create: true }), w = await fh.createWritable(); await w.write(blob); await w.close(); } else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); a.remove(); await new Promise(r => setTimeout(r, 600)); } }
  log(`${slug}: ${(mp4.size / 1048576).toFixed(1)} MB, ${(N / fps).toFixed(0)} s`);
}
if (LOTE) { document.body.classList.add('lote'); st.remove();
  const logEl = document.getElementById('log'), log = t => { logEl.textContent = t + '\n' + logEl.textContent; }, bt = document.getElementById('ir');
  const todos = (q.get('so') ? q.get('so').split(',') : Object.keys(window.CONTEUDO)).filter(s => window.CONTEUDO[s] && window.__EX);
  bt.onclick = async () => { bt.disabled = true; let pasta = null;
    try { if (window.showDirectoryPicker) pasta = await window.showDirectoryPicker({ mode: 'readwrite', id: 'anabtech-videos' }); } catch (e) { bt.disabled = false; return; }
    await Promise.all(['700 40px "Space Grotesk"', '500 40px "Space Grotesk"', '500 40px Inter', '600 40px Inter', '700 40px Inter'].map(f => document.fonts.load(f)));
    let wl = null; try { wl = await navigator.wakeLock.request('screen'); } catch (e) {}
    const L = todos.filter(s => window.__EX[s]); let feitos = 0, falhas = 0, novos = 0, t0 = performance.now();
    /* vídeos de uma versão anterior do 3D que estejam na pasta são refeitos; os da versão atual são aproveitados (dá para parar e continuar) */
    const VERSAO = '3d-v4'; let refazer = false;
    if (pasta) { try { const f = await (await pasta.getFileHandle('versao.txt')).getFile(); refazer = (await f.text()).trim() !== VERSAO; } catch (e) { refazer = true; }
      if (refazer) log('Os vídeos que já estavam na pasta são de uma versão anterior e serão refeitos.'); const w = await (await pasta.getFileHandle('versao.txt', { create: true })).createWritable(); await w.write(VERSAO); await w.close(); }
    for (const slug of L) { try { let ja = false; if (pasta && !refazer) { try { await pasta.getFileHandle(slug + '.mp4'); ja = true; } catch (e) {} } if (ja) log(slug + ': já estava pronto'); else { for (let vez = 1; ; vez++) { try { await gravar(slug, pasta, log); break; } catch (e) { if (vez >= 3) throw e; log(`${slug}: tentando de novo (${e && e.message || e})`); await new Promise(r => setTimeout(r, 3000)); } } } } catch (e) { falhas++; log(`${slug}: ERRO ${e && e.message || e}`); }
      feitos++; document.querySelector('#barra i').style.width = (feitos / L.length * 100) + '%'; const dt = (performance.now() - t0) / 1000; document.getElementById('prog').textContent = `${feitos} de ${L.length} vídeos · ${Math.round(dt / 60)} min`; }
    document.getElementById('prog').textContent = falhas ? `Terminou com ${falhas} vídeo(s) com erro. Clique no botão de novo e escolha a mesma pasta para refazer só os que faltam.` : `Pronto: ${L.length} vídeos na pasta. Pode fechar esta aba.`; if (falhas) bt.disabled = false; if (wl) wl.release(); };
}
window.__pronto = LOTE ? Promise.resolve({ lote: 1 }) : (async () => {
  await Promise.all(['700 40px "Space Grotesk"', '500 40px "Space Grotesk"', '500 40px Inter', '600 40px Inter', '700 40px Inter'].map(f => document.fonts.load(f)));
  const slug = q.get('ex') || 'supino-barra', K = window.CONTEUDO[slug] || {};
  const api = await window.__studio(slug, { ss: +(q.get('ss') || 1), shadow: +(q.get('sombra') || 2048) });
  const Q = window.Estudio.criarQuadro(api, K, cv, q.get('tema') || 'claro');
  window.__api = api; window.__Q = Q; window.__quadro = t => { Q.desenhar(t); return true; };
  window.__jpeg = (t, ql) => { Q.desenhar(t); return cv.toDataURL('image/jpeg', ql || .95); };
  st.textContent = `${slug} · ${Q.R.dur.toFixed(1)} s · ${Q.R.frames} quadros`;
  Q.desenhar(+(q.get('t') || 0));
  if (q.get('play') === '1') { const t0 = performance.now(); const loop = () => { Q.desenhar(((performance.now() - t0) / 1000) % Q.R.dur); requestAnimationFrame(loop); }; loop(); }
  return { dur: Q.R.dur, frames: Q.R.frames, segs: Q.R.S.map(s => [s.tipo, +s.t0.toFixed(2), +s.t1.toFixed(2)]) };
})();
</script></body></html>
