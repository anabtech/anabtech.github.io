<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AnabTech">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<title>AnabTech · Minha página</title>
<style>
:root{--paper:#f2f3ef;--card:#fff;--rule:#dfe2da;--rule-soft:#ecede8;--ink:#0b0c0e;--ink-2:#5d626a;--ink-3:#90959c;--accent:#c8ff3d;--accent-ink:#4f6b00;--on-accent:#0b0c0e;--accent-soft:#eefad0;--ok:#16a34a;--ok-soft:#dcfce7;--down:#c2410c}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;font-size:14px;min-height:100vh}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
.tela{max-width:420px;margin:0 auto;padding:max(48px,env(safe-area-inset-top)) 22px 40px;text-align:center}
.tela .mk{font-size:15px;font-weight:700;letter-spacing:-.01em}.tela .mk{font-family:'Space Grotesk',var(--f,sans-serif)}.mk b{color:var(--accent-ink);font-weight:400}
.tela h1{font-size:27px;line-height:1.15;letter-spacing:-.02em;margin:34px 0 8px}
.tela p{color:var(--ink-2);font-size:15px}
.pin{display:flex;gap:10px;justify-content:center;margin:26px 0 10px}
.pin input{width:58px;height:66px;border:1.5px solid var(--rule);border-radius:14px;background:var(--card);text-align:center;font-size:28px;font-weight:600;outline:none}
.pin input:focus{border-color:var(--ink)}
.erro{color:var(--down);font-size:14px;min-height:22px;margin-top:6px}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:600;font-size:15px;cursor:pointer;width:100%}
.bt.ln{background:var(--card);color:var(--ink);border-color:var(--rule)}
.bt:disabled{opacity:.55}
.carregando{display:inline-block;width:22px;height:22px;border:2.5px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:gira .8s linear infinite;margin-top:30px}
@keyframes gira{to{transform:rotate(360deg)}}
/* faixa de status */
.st{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(calc(100% + 40px));visibility:hidden;background:var(--ink);color:#fff;padding:11px 17px;border-radius:999px;font-size:14px;font-weight:500;z-index:90;transition:transform .25s;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 8px 24px rgba(11,12,14,.25)}
.st.on{transform:translateX(-50%) translateY(0);visibility:visible}
.fila{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:9px 12px;font-size:13px;margin:12px 0 0}
/* registro de cargas */
.lg{margin:12px 15px 0 42px;padding:12px 12px 10px;border-radius:12px;background:var(--paper)}
.lg-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.lg-h b{font-size:13px}
.lg-ult{font-size:12px;color:var(--ink-2);text-align:right}
.lg-r{display:grid;grid-template-columns:minmax(22px,auto) 1fr 16px 1fr;align-items:center;gap:6px;margin-bottom:6px}
.lg-n{font-size:12.5px;color:var(--ink-2);font-weight:600;text-align:center;white-space:nowrap}.lg-r.tec .lg-n{font-size:11.5px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:3px 6px;min-width:52px}
.lg-r input{width:100%;min-width:0;height:40px;border:1px solid var(--rule);border-radius:10px;background:var(--card);padding:0 10px;font-size:16px;outline:none}
.lg-r input:focus{border-color:var(--ink)}
.lg-r .x{text-align:center;color:var(--ink-3)}
.lg-add{border:none;background:none;color:var(--accent-ink);font-weight:600;font-size:13px;padding:4px 0;cursor:pointer}
.lg-nota{width:100%;min-height:42px;border:1px solid var(--rule);border-radius:10px;background:var(--card);padding:9px 10px;font-size:15px;resize:vertical;margin-top:6px;outline:none}
.lg-fim{margin:14px 0 6px}
.lg-fim p{text-align:center;color:var(--ink-2);font-size:13px;margin-top:8px}
.lg-fim p.ok{color:var(--ok);font-weight:600}
.ex.feito{border-color:#86efac}
/* dia do registro e lembretes */
.dreg{display:none;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;margin:12px 0 0;font-size:14px}
#tb-t:checked~main .dreg,#tb-d:checked~main .dreg{display:flex}
.dreg label{font-weight:600}
.dreg select{flex:1;min-width:150px;height:40px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);padding:0 10px;font-size:16px;font-weight:600}
.dreg.outro{background:var(--accent-soft);border:2px solid var(--accent)}
.dreg.outro .dr-msg{flex-basis:100%;font-size:13px;color:#9a3412}
.dreg .dr-hoje{border:none;background:none;color:var(--accent-ink);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0}
.lemb{background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;margin:12px 0 0}
.lemb h3{font-size:16px;margin-bottom:2px}.lemb p{font-size:14px;color:rgba(255,255,255,.92)}
.lemb .lb{display:flex;gap:8px;margin-top:10px}.lemb button{flex:1;min-height:40px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--ink)}
.lemb button.ln{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.lcal{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:14px 16px;margin:0 0 16px}
.lcal h3{font-size:16px;margin-bottom:2px}.lcal p{color:var(--ink-2);font-size:13.5px}
.lcal .lh{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lcal .lh a{flex:1 0 auto;min-width:64px;display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);font-weight:600;color:var(--ink);text-decoration:none}
.lcal small{display:block;margin-top:8px;color:var(--ink-3);font-size:12px}
/* avisos do MG na tela inicial */
.mgc{border-radius:16px;padding:14px 16px;margin:12px 0 0;box-shadow:0 6px 18px -10px rgba(11,12,14,.35)}
.mgc h3{font-size:16px;margin-bottom:3px;display:flex;align-items:center;gap:8px}.mgc h3 i{font-style:normal;font-size:18px}
.mgc p{font-size:14px}.mgc .lb{display:flex;gap:8px;margin-top:10px}.mgc button{flex:1;min-height:42px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer}
.mgc.fb{background:#0b0c0e;color:#fff}.mgc.fb p{color:rgba(255,255,255,.85)}.mgc.fb button{background:var(--accent);border:none;color:var(--on-accent)}
.mgc.rs{background:#eef6ff;border:2px solid #1668a8}.mgc.rs h3{color:#1668a8}.mgc.rs small{display:block;color:var(--ink-2);font-size:12.5px;margin-bottom:6px}
.mgc .q{background:#fff;border-radius:10px;padding:8px 10px;font-size:13.5px;color:var(--ink-2);white-space:pre-wrap;margin-bottom:8px}
.mgc .r{font-size:15px;white-space:pre-wrap;color:var(--ink)}.mgc.rs button{background:#1668a8;border:none;color:#fff}
.rsl{margin-top:16px}.rsl h2{font-size:18px;margin-bottom:8px}.rsl .it{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.rsl small{display:block;color:var(--ink-3);font-size:12px;margin-bottom:4px}.rsl .q{font-size:13.5px;color:var(--ink-2);white-space:pre-wrap}.rsl .r{margin-top:6px;font-size:14.5px;white-space:pre-wrap;border-left:3px solid #1668a8;padding-left:9px}
.dnota{display:block;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;margin:12px 0}
.dnota span{display:block;font-weight:600;font-size:14px;margin-bottom:6px}.dnota small{display:block;font-size:12px;color:var(--ink-3);margin-top:4px}
.dnota textarea{width:100%;min-height:60px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);padding:9px 10px;font-size:15px;resize:vertical;outline:none}
/* água e semana */
.agua{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 15px;margin:0 0 12px}
.ag-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}.ag-t b{font-size:18px}.ag-t span{color:var(--ink-2);font-size:13px}
.ag-b{height:10px;border-radius:999px;background:#e0f2fe;margin-top:8px;overflow:hidden}.ag-b i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#0284c7);border-radius:999px;transition:width .3s}
.ag-bt{display:flex;gap:6px;margin-top:10px}.ag-bt button{flex:1;min-height:40px;border-radius:10px;border:1px solid #bae6fd;background:#f0f9ff;color:#0369a1;font-weight:700;font-size:13.5px;cursor:pointer}.ag-bt button.mn{flex:0 0 44px;background:var(--paper);border-color:var(--rule);color:var(--ink-2)}
.sem{background:var(--card);border:1px solid var(--rule);border-radius:14px;margin:0 0 12px;overflow:hidden}
.sem summary{list-style:none;cursor:pointer;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14.5px}.sem summary::-webkit-details-marker{display:none}.sem summary::after{content:"▾";color:var(--ink-3)}.sem[open] summary::after{content:"▴"}
.sem-b{padding:0 15px 14px}.sem-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sem-g div{background:var(--paper);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}.sem-g span{font-size:11.5px;color:var(--ink-2);font-weight:600}.sem-g b{font-size:16px}.sem-g small{font-size:11.5px;color:var(--ink-2)}
.sem-g .ok{background:#ecfdf3}.sem-g .md{background:#fef9c3}.sem-g .bx{background:#fee2e2}
.sem-d{display:flex;gap:4px;align-items:flex-end;height:70px;margin:12px 0 4px}.sem-d div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}.sem-d i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:2px}.sem-d i.vz{background:var(--rule)}.sem-d span{font-size:10.5px;color:var(--ink-3)}
.sem-n{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.45}
/* comi outra coisa */
.oc-bt{display:block;width:calc(100% - 30px);margin:6px 15px 0;min-height:38px;border:1px dashed var(--rule);border-radius:10px;background:transparent;color:var(--ink-2);font-size:13.5px;font-weight:600;cursor:pointer}
.ck.troca.on{background:#eef6ff!important;color:#1668a8!important;border-color:#93c5fd!important}
.ck.parc.on{background:#fff7ed!important;color:#9a3412!important;border-color:#fdba74!important}
.atv-c{background:var(--card,#fff);border:1px solid var(--rule);border-radius:16px;padding:14px 15px;margin:16px 0 8px}
.atv-c b{display:block;font-size:15.5px}.atv-c>span{display:block;font-size:13px;color:var(--ink-2);margin:2px 0 10px}
.atv-c .bt{width:100%}.atv-f{margin-top:10px;display:flex;flex-direction:column;gap:6px}.atv-f div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;background:var(--paper);border-radius:10px;padding:8px 10px}.atv-f div em{font-style:normal;font-weight:700;white-space:nowrap}
.atv-g{display:flex;gap:6px;overflow-x:auto;padding:10px 0 6px;-webkit-overflow-scrolling:touch}.atv-g button{flex:none;min-height:34px;border-radius:999px;border:1px solid var(--rule);background:var(--card,#fff);color:var(--ink-2);font-size:13px;font-weight:600;padding:0 12px;cursor:pointer}.atv-g button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.atv-l button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card,#fff);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;margin-top:6px;font:inherit;color:var(--ink);cursor:pointer}.atv-l button small{display:block;color:var(--ink-2);font-size:12px}.atv-l button em{font-style:normal;font-weight:700;font-size:13px;white-space:nowrap;color:var(--ink-2)}
.atv-s{background:var(--card,#fff);border:1.5px solid var(--ink);border-radius:14px;padding:12px}.atv-s h4{font-size:16px}.atv-s label{display:block;font-size:12.5px;color:var(--ink-2);margin-top:10px}.atv-s input,.atv-s textarea{width:100%;margin-top:4px;min-height:44px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);padding:8px 10px;font-size:16px;color:var(--ink)}
.atv-k{margin-top:10px;font-size:13.5px;background:var(--accent-soft,#eefad0);border-radius:10px;padding:8px 10px}
.pc-it{background:var(--card,#fff);border:1px solid var(--rule);border-radius:14px;padding:11px 12px;margin-top:8px}
.pc-it b{display:block;font-size:14.5px}.pc-it small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px}
.pc-fr{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:9px}
.pc-fr button{min-height:40px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);font-size:12.5px;font-weight:600;cursor:pointer;padding:0 2px}
.pc-fr button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pc-fr button[aria-pressed="true"][data-f="0"]{background:#b8381f;border-color:#b8381f}
.pc-at{display:flex;gap:6px;margin-top:10px}.pc-at button{flex:1;min-height:36px;border-radius:999px;border:1px dashed var(--rule);background:transparent;color:var(--ink-2);font-size:13px;font-weight:600;cursor:pointer}
.ov{position:fixed;inset:0;z-index:80;background:rgba(11,12,14,.45);display:flex;align-items:flex-end;justify-content:center}
.ov-c{background:var(--paper,#f6f7f9);width:100%;max-width:560px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.ov-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 16px 10px;background:var(--card,#fff);border-bottom:1px solid var(--rule)}
.ov-h small{display:block;font-size:12px;color:var(--ink-3);font-weight:600}.ov-h h3{font-size:19px;letter-spacing:-.01em}
.ov-x{flex:none;width:38px;height:38px;border-radius:999px;border:none;background:var(--paper);font-size:20px;cursor:pointer;color:var(--ink-2)}
.ov-b{flex:1;overflow:auto;padding:12px 16px 16px;-webkit-overflow-scrolling:touch}
.ov-f{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card,#fff);border-top:1px solid var(--rule)}
.ov-f button{flex:1;min-height:46px;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer;border:1px solid var(--rule);background:var(--card,#fff);color:var(--ink)}
.ov-f .pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.ov-f .pri:disabled{opacity:.45}
.oc-ia{margin-top:10px;background:var(--card,#fff);border:1px solid var(--rule);border-radius:14px;padding:12px}
.oc-ia label[for]{display:block}.oc-ia label b{display:block;font-size:14.5px}.oc-ia label span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.oc-ia textarea{width:100%;margin-top:8px;border:1px solid var(--rule);border-radius:10px;background:var(--paper,#f2f3ef);padding:9px 10px;font:inherit;font-size:16px;line-height:1.4;resize:vertical;min-height:62px;outline:none;color:var(--ink)}
.oc-ia textarea:focus{border-color:var(--ink)}
.oc-ia-a{display:flex;align-items:center;gap:8px;margin-top:8px}
.oc-ia-f{flex:1;min-width:0;display:flex;align-items:center;gap:7px;height:40px;padding:0 12px;border:1px solid var(--rule);border-radius:10px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.oc-ia-f span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-ia-th{flex:1;position:relative;display:flex;align-items:center;gap:8px}.oc-ia-th img{width:40px;height:40px;object-fit:cover;border-radius:8px}.oc-ia-th button{width:28px;height:28px;border-radius:50%;border:1px solid var(--rule);background:var(--card,#fff);font-size:16px;line-height:1;color:var(--ink-2);cursor:pointer}
.oc-ia-b{flex:none;height:40px;padding:0 18px;border-radius:10px;border:0;background:var(--ink);color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer}.oc-ia-b:disabled{opacity:.6}
.oc-ia-m{font-size:12.5px;line-height:1.45;color:var(--ink-2);margin-top:8px}
.oc-ia-tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--ink-2);border:1px solid var(--rule);border-radius:5px;padding:0 4px;margin-left:4px;vertical-align:1px}
.oc-it .oc-aj{display:block;width:auto;height:auto;border:0;border-radius:0;background:none;padding:2px 0 0;font-family:inherit;font-size:12.5px;color:var(--ink-2);text-align:left;cursor:pointer}.oc-it .oc-aj u{color:var(--ink);margin-left:3px;text-underline-offset:2px}
.oc-ou+.oc-busca{margin-top:6px}
.oc-adj{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px 10px;margin:-2px 0 2px}.oc-adj .oc-calc{grid-column:1/-1;margin:0}.oc-adj .oc-add{grid-column:1/-1}.oc-adj-u{font-size:13px;color:var(--ink-2)}
.oc-ou{text-align:center;font-size:12px;color:var(--ink-3);margin:16px 0 0}
.oc-plan{font-size:12.5px;color:var(--ink-2);background:var(--card,#fff);border:1px solid var(--rule);border-radius:10px;padding:8px 10px}
.oc-gbt{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;padding:10px 12px;border-radius:12px;border:1px solid #fed7aa;background:#fff7ed;color:#9a3412;font-weight:600;font-size:13.5px;cursor:pointer;text-align:left}
.oc-its{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.oc-it{display:flex;align-items:center;gap:10px;background:var(--card,#fff);border:1px solid var(--rule);border-radius:12px;padding:9px 10px}
.oc-it div{flex:1;min-width:0}.oc-it b{display:block;font-size:14px}.oc-it span{font-size:12.5px;color:var(--ink-2)}
.oc-it em{font-style:normal;font-weight:700;font-size:13.5px;white-space:nowrap}.oc-it button{flex:none;width:32px;height:32px;border-radius:999px;border:none;background:var(--paper);color:var(--ink-2);font-size:16px;cursor:pointer}
.oc-tot{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.oc-tot div{background:#0b0c0e;color:#fff;border-radius:10px;padding:7px 8px;display:flex;flex-direction:column}.oc-tot span{font-size:11px;opacity:.75}.oc-tot b{font-size:15px}
.oc-vazio{font-size:13.5px;color:var(--ink-3);text-align:center;padding:14px 8px;border:1px dashed var(--rule);border-radius:12px;margin-top:12px}
.oc-busca{position:relative;margin-top:14px}.oc-busca input{width:100%;height:46px;border:1.5px solid var(--ink);border-radius:12px;background:var(--card,#fff);padding:0 12px 0 38px;font-size:16px;outline:none}
.oc-busca::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.6}
.oc-res{display:flex;flex-direction:column;margin-top:6px;background:var(--card,#fff);border-radius:12px;overflow:hidden}
.oc-res button{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 12px;border:none;border-bottom:1px solid var(--rule);background:transparent;text-align:left;font-size:14px;cursor:pointer;color:var(--ink)}
.oc-res button small{color:var(--ink-3);font-size:12px;white-space:nowrap}

<body>
<div id="app"><div class="tela"><span class="carregando"></span></div></div>
<div class="st" id="st"></div>
<div class="tmr" id="tmr" hidden role="timer"><i class="tmr-b" id="tmrB"></i><div class="tmr-in"><small id="tmrN">Descanso</small><div class="tmr-l"><b id="tmrT">0:00</b></div><button type="button" data-d="-15" aria-label="Tirar 15 segundos">−15 s</button><button type="button" data-d="15" aria-label="Somar 15 segundos">+15 s</button><button type="button" class="tmr-x">Pular</button></div></div>
<script>
'use strict';
const API = 'https://script.google.com/macros/s/AKfycbySZvMkRRn4x4WagqeLlU2m8urelZt2q_vnlHVDwHLYGnLgj891lNzCCE-AArD_MRBYFA/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem('mgal.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mgal.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('mgal.' + k); } catch (e) {} }
};
const hojeISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const kgTxt = v => String(v).replace('.', ',');
const dataBR = iso => { const [y, m, d] = String(iso).split('-'); return d ? `${d}/${m}` : iso; };
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const DIAS_JS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sab'];
/* dia do registro: hoje por padrão; o aluno pode voltar até 7 dias para registrar o que esqueceu */
let DIA_REG = '';
const isoMenos = n => { const d = new Date(); d.setDate(d.getDate() - n); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const dataReg = () => DIA_REG || hojeISO();
const dowISO = iso => new Date(iso + 'T12:00:00').getDay();
const DSEM = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const nomeDiaReg = iso => iso === hojeISO() ? 'hoje' : iso === isoMenos(1) ? 'ontem' : `${DSEM[dowISO(iso)]}, ${dataBR(iso)}`;
const deDia = iso => iso === hojeISO() || iso === isoMenos(1) ? 'de ' + nomeDiaReg(iso) : 'de ' + dataBR(iso);
let _stT;
function aviso(t, ms = 2600) { const el = $('st'); el.textContent = t; el.classList.add('on'); clearTimeout(_stT); _stT = setTimeout(() => el.classList.remove('on'), ms); }

/* ---------- link e código ---------- */
/* ---------- veio do endereço antigo (mgcoach.github.io): traz o que estava guardado no celular ---------- */
let MIGROU = false;
let ABRIR_REL = /[#&]rel=1(?:&|$)/.test(location.hash);   /* link do relatório que o treinador mandou */
if (ABRIR_REL) { const t0 = new URLSearchParams(location.hash.slice(1)).get('t'); try { history.replaceState(null, '', location.pathname + location.search + (t0 ? '#t=' + t0 : '')); } catch (e) {} }
(function () {
  const m = location.hash.match(/[#&]mig=([^&]+)/); if (!m) return;
  try {
    let b = m[1].replace(/-/g, '+').replace(/_/g, '/'); while (b.length % 4) b += '=';
    const bin = atob(b), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const pk = JSON.parse(new TextDecoder().decode(u));
    if (pk && pk.v === 1 && pk.ls && !LS.get('migrou', false)) {
      const vazio = !LS.get('pin', '') && !Object.keys(LS.get('hist', {})).length && !LS.get('fila', []).length;
      if (vazio) Object.entries(pk.ls).forEach(([k, v]) => { if (/^mgal\./.test(k) && typeof v === 'string') { try { localStorage.setItem(k, v); } catch (e) {} } });
      LS.set('migrou', true); MIGROU = true;
    }
  } catch (e) {}
  const t = new URLSearchParams(location.hash.slice(1)).get('t');
  try { history.replaceState(null, '', location.pathname + location.search + (t ? '#t=' + t : '')); } catch (e) {}
})();
function tokenDaUrl() { const h = new URLSearchParams(location.hash.slice(1)); return h.get('t') || new URLSearchParams(location.search).get('t') || ''; }
let T = tokenDaUrl();
if (T && T !== LS.get('t', '')) { ['pin', 'snap'].forEach(LS.del); LS.set('t', T); }
T = T || LS.get('t', '');
if (T && !tokenDaUrl()) { try { history.replaceState(null, '', location.pathname + '#t=' + T); } catch (e) {} }
let PIN = LS.get('pin', ''), SNAP = LS.get('snap', null);
/* perfil próprio do treinador: ícone com fundo preto para não confundir com o app da consultoria (verde) na tela inicial */
function iconePerfil() { const pr = !!(SNAP && SNAP.proprio), sfx = pr ? '-preto' : '';
  const at = document.querySelector('link[rel=apple-touch-icon]'), fv = document.querySelector('link[rel=icon]');
  if (at && at.getAttribute('href') !== 'apple-touch-icon' + sfx + '.png') at.setAttribute('href', 'apple-touch-icon' + sfx + '.png');
  if (fv && fv.getAttribute('href') !== 'favicon' + sfx + '.png') fv.setAttribute('href', 'favicon' + sfx + '.png'); }
iconePerfil();

async function buscar(pin) {
  const r = await fetch(`${API}?acao=aluno&t=${encodeURIComponent(T)}&p=${encodeURIComponent(pin)}`, { cache: 'no-store' });
  return r.json();
}
function telaSemLink() {
  $('app').innerHTML = `<div class="tela"><span class="mk">anab<b>tech</b></span><h1>Link incompleto</h1><p>Abra de novo o link que seu coach mandou pelo WhatsApp.</p></div>`;
}
function telaInativa() {
  ['pin', 'snap'].forEach(LS.del);
  $('app').innerHTML = `<div class="tela"><span class="mk">anab<b>tech</b></span><h1>Página indisponível</h1><p>Esta página não está ativa no momento. Fale com seu coach pelo WhatsApp.</p></div>`;
}
function telaPin(msg) {
  $('app').innerHTML = `<div class="tela"><span class="mk">anab<b>tech</b></span><h1>Sua página</h1><p>Digite o código de 4 números que seu coach mandou junto com o link.</p>
    <form id="pf"><div class="pin">${[0, 1, 2, 3].map(i => `<input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Número ${i + 1}" data-i="${i}">`).join('')}</div>
    <p class="erro" id="pe">${esc(msg || '')}</p><button class="bt" id="pb" type="submit" style="margin-top:12px">Entrar</button></form></div>`;
  const ins = [...document.querySelectorAll('.pin input')];
  ins.forEach((el, i) => {
    el.addEventListener('input', () => { el.value = el.value.replace(/\D/g, '').slice(-1); if (el.value && i < 3) ins[i + 1].focus(); if (ins.every(x => x.value)) $('pf').requestSubmit(); });
    el.addEventListener('keydown', e => { if (e.key === 'Backspace' && !el.value && i > 0) ins[i - 1].focus(); });
    el.addEventListener('paste', e => { const d = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4); if (d.length === 4) { e.preventDefault(); d.split('').forEach((c, j) => ins[j].value = c); $('pf').requestSubmit(); } });
  });
  ins[0].focus();
  $('pf').onsubmit = async e => {
    e.preventDefault(); const pin = ins.map(x => x.value).join(''); if (pin.length < 4) return;
    $('pb').disabled = true; $('pb').textContent = 'Entrando…'; $('pe').textContent = '';
    try {
      const r = await buscar(pin);
      if (r.ok) { PIN = pin; LS.set('pin', pin); SNAP = r.dados; LS.set('snap', SNAP); montar(); enviarFila(); return; }
      if (r.erro === 'link') return telaInativa();
      $('pe').textContent = r.erro === 'bloqueado' ? 'Muitas tentativas. Espere 15 minutos e tente de novo.' : 'Código errado. Confira a mensagem do seu coach.';
    } catch (err) { $('pe').textContent = 'Não deu para conectar. Confira a internet e tente de novo.'; }
    ins.forEach(x => x.value = ''); ins[0].focus(); $('pb').disabled = false; $('pb').textContent = 'Entrar';
  };
}

/* ---------- fila de envios (funciona sem internet e manda depois) ---------- */
let _enviando = false;
function fila() { return LS.get('fila', []); }
function enfileirar(reg) { const f = fila().filter(x => x.id !== reg.id || x.tipo !== reg.tipo); f.push(reg); LS.set('fila', f); mostrarFila(); return enviarFila(); }
let _deNovo = false; /* chegou registro novo enquanto a fila estava sendo enviada: manda de novo no fim */
async function enviarFila() {
  if (!PIN) return; if (_enviando) { _deNovo = true; return; } _enviando = true; _deNovo = false;
  let enviados = 0;
  try {
    for (const reg of fila()) {
      let r = '';
      try { const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao: 'registro', t: T, p: PIN, reg }) }); r = (await res.text()).trim(); }
      catch (e) { break; }
      if (r === 'ok' || r === 'invalido') { LS.set('fila', fila().filter(x => !(x.id === reg.id && x.tipo === reg.tipo && x._v === reg._v))); enviados++; }
      else if (r === 'codigo' || r === 'link') { LS.del('pin'); PIN = ''; return r === 'link' ? telaInativa() : telaPin('O código mudou. Peça o código novo ao seu coach.'); }
      else break;
    }
  } finally { _enviando = false; mostrarFila(); if (_deNovo) { _deNovo = false; setTimeout(enviarFila, 50); } }
  return enviados;
}
function mostrarFila() {
  const el = $('filaAv'); if (!el) return; const n = fila().length;
  el.hidden = !n; el.textContent = n === 1 ? '1 registro esperando internet para chegar ao seu coach.' : `${n} registros esperando internet para chegar ao seu coach.`;
}
window.addEventListener('online', () => enviarFila());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { enviarFila(); atualizarSnap(); } });

/* ---------- monta a página a partir do protocolo publicado ---------- */
function montar() { iconePerfil();
  if (!SNAP || !SNAP.html) return telaPin();
  const doc = new DOMParser().parseFromString(SNAP.html, 'text/html');
  let st = $('pcss'); if (!st) { st = document.createElement('style'); st.id = 'pcss'; document.head.appendChild(st); }
  st.textContent = [...doc.querySelectorAll('style')].map(x => x.textContent).join('\n') + `\n.vlink{aspect-ratio:9/16!important}#tb-f:checked~main .pg-f{display:block}#tb-f:checked~.bar label[for=tb-f]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}#tb-n:checked~main .pg-n{display:block}#tb-n:checked~.bar label[for=tb-n]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}#tb-e:checked~main .pg-e{display:block}#tb-e:checked~.bar label[for=tb-e]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}`;
  /* os vídeos mudaram de endereço (repositório próprio): treinos publicados antes continuam valendo */
  doc.querySelectorAll('a.vlink, .vlink img, video').forEach(el => ['href', 'src', 'poster'].forEach(at => { const v = el.getAttribute(at); if (v && v.includes('anabtech.github.io/app/videos/')) el.setAttribute(at, v.replace('anabtech.github.io/app/videos/', 'anabtech.github.io/videos/')); }));
  doc.querySelectorAll('.vlink img').forEach(i => i.setAttribute('loading', 'lazy'));
  $('app').innerHTML = doc.body.innerHTML;
  const app = $('app');
  { const mk = app.querySelector('.bar .mark'); if (mk) mk.innerHTML = '<svg class="sym" viewBox="0 0 100 100" aria-hidden="true"><path d="M24 82 L50 38 L76 82" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M37 66 H63" stroke="currentColor" stroke-width="9" stroke-linecap="round"/><circle cx="50" cy="18" r="8" fill="currentColor"/></svg><span>' + mk.innerHTML + '</span>'; const tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.content = '#0b0c0e'; }
  /* aba Feedback */
  const radios = app.querySelectorAll('input.rd[name=tab]'); const ult = radios[radios.length - 1];
  ult.insertAdjacentHTML('afterend', '<input type="radio" class="rd" name="tab" id="tb-f">');
  app.querySelector('.navs').insertAdjacentHTML('beforeend', '<label class="linkbtn" for="tb-f">Feedback</label>');
  app.querySelector('#tb-f').insertAdjacentHTML('afterend', '<input type="radio" class="rd" name="tab" id="tb-n">');
  app.querySelector('.bar-in').insertAdjacentHTML('beforeend', '<label class="sino" for="tb-n" role="button" aria-label="Novidades do app"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg><i class="nvdot" id="nvDot" hidden></i></label>');
  app.querySelector('#tb-n').insertAdjacentHTML('afterend', '<input type="radio" class="rd" name="tab" id="tb-e">');

/* ---------- pagamento do plano: Pix (QR Code e copia e cola) e cartão (link do Mercado Pago) ---------- */
const brl = v => 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const diasAte = iso => Math.round((new Date(iso + 'T12:00:00') - new Date(hojeISO() + 'T12:00:00')) / 864e5);
const pgInformado = () => { const P = SNAP.pag; return P && LS.get('pgInf.' + (P.venc || 'x'), null); };
function emv(id, v) { v = String(v); return id + String(v.length).padStart(2, '0') + v; }
function crc16(t) { let c = 0xFFFF; for (let i = 0; i < t.length; i++) { c ^= t.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, '0'); }
const semAcento = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9 .-]/g, '').toUpperCase().trim();
function pixCopiaCola(px, valor, txid) {
  const p = emv('00', '01') + emv('26', emv('00', 'br.gov.bcb.pix') + emv('01', px.chave)) + emv('52', '0000') + emv('53', '986') + (valor > 0 ? emv('54', valor.toFixed(2)) : '') +
    emv('58', 'BR') + emv('59', semAcento(px.nome).slice(0, 25) || 'AnabTech') + emv('60', semAcento(px.cidade).slice(0, 15) || 'SALVADOR') + emv('62', emv('05', String(txid || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 25) || '***')) + '6304';
  return p + crc16(p);
}
function cardPag() {
  const P = SNAP.pag; if (!P || !P.venc) return '';
  const d = diasAte(P.venc), inf = pgInformado();
  if (d > 7) return ''; /* semana da renovação */
  if (inf) return `<div class="mgc pgok" role="status"><h3>Pagamento informado</h3><p>Você avisou que pagou por ${inf.forma === 'cartao' ? 'cartão' : 'Pix'}. Assim que a gente confirmar, o seu plano renova.</p></div>`;
  const t = d < 0 ? `Seu plano venceu em ${dataBR(P.venc)}` : d === 0 ? 'Seu plano vence hoje' : d === 1 ? 'Seu plano vence amanhã' : `Semana de renovação: seu plano vence em ${d} dias`;
  return `<div class="mgc mpg" role="status"><h3>${esc(t)}</h3><p>${d < 0 ? 'Faça o pagamento para retomar o acompanhamento' : `Faça o pagamento até ${dataBR(P.venc)} para seguir sem pausa no acompanhamento`}. É rápido: Pix ou cartão aqui mesmo no app.</p><div class="lb"><button type="button" id="mgPg">Pagar plano</button></div></div>`;
}
function irPagamento() { const tb = $('tb-f'); if (tb) { tb.checked = true; LS.set('aba', 'tb-f'); } const s = $('pagSec'); if (s) setTimeout(() => s.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50); }
function blocoPag() {
  const P = SNAP.pag, d = P.venc ? diasAte(P.venc) : 99, inf = pgInformado();
  const st = !P.venc ? '' : d < 0 ? `<span class="pg-st vc">Venceu em ${dataBR(P.venc)}</span>` : d <= 7 ? `<span class="pg-st av">Vence ${d === 0 ? 'hoje' : 'em ' + dataBR(P.venc)}</span>` : `<span class="pg-st">Em dia até ${dataBR(P.venc)}</span>`;

    ${C ? `<div class="pg-tb" role="tablist"><button type="button" class="on" data-pg="pix" role="tab" aria-selected="true">Pix</button><button type="button" data-pg="cartao" role="tab" aria-selected="false">Cartão</button></div>` : '<div style="height:12px"></div>'}
    <div data-pp="pix"><div class="pg-qr" id="pgQr"><span style="font-size:13px;color:var(--ink-3)">Gerando QR Code…</span></div>
      <button class="pg-bt pri" type="button" id="pgCopia">Copiar Pix copia e cola</button>

      <p class="note">O valor no cartão inclui a taxa da operadora (${String(C.taxa).replace('.', ',')}%), para a consultoria custar o mesmo que no Pix. Se parcelar, os juros do cartão aparecem no Mercado Pago antes de você confirmar.</p>
      <a class="pg-bt pri" href="${esc(C.link)}" target="_blank" rel="noopener">Pagar com cartão</a></div>` : ''}
    ${inf ? `<div class="pg-inf">✓ Você informou o pagamento por ${inf.forma === 'cartao' ? 'cartão' : 'Pix'} em ${dataBR(inf.data)}. A gente confirma em breve.</div>`
      : P.aviso ? `<button class="pg-bt ok" type="button" id="pgJa">Já paguei</button><p class="note" style="text-align:center">Toque depois de pagar. A gente confere e confirma a renovação.</p>`

}
let _qrLib;
/* gerador de QR Code (qrcode-generator, MIT, Kazuhiko Arase) fica junto do app: qr.js */
function carregarQR() { if (window.qrcode) return Promise.resolve(); if (_qrLib) return _qrLib;
  _qrLib = new Promise((ok, erro) => { const sc = document.createElement('script'); sc.src = 'qr.js'; sc.onload = ok; sc.onerror = () => { _qrLib = null; erro(); }; document.head.appendChild(sc); }); return _qrLib; }
function ligarPag() {
  const P = SNAP.pag, sec = $('pagSec'); if (!sec) return;
  const code = pixCopiaCola(P.pix, P.valor, 'MG' + String(P.venc || '').replace(/-/g, ''));
  carregarQR().then(() => { const q = $('pgQr'); if (!q) return; const qr = qrcode(0, 'M'); qr.addData(code); qr.make(); q.innerHTML = qr.createSvgTag({ cellSize: 5, margin: 2, scalable: true }); const sv = q.querySelector('svg'); if (sv) { sv.setAttribute('width', '200'); sv.setAttribute('height', '200'); sv.setAttribute('role', 'img'); sv.setAttribute('aria-label', 'QR Code do Pix'); } })
    .catch(() => { const q = $('pgQr'); if (q) q.innerHTML = '<span style="font-size:13px;color:var(--ink-3)">Sem internet para o QR Code. Use o copia e cola.</span>'; });
  $('pgCopia').onclick = async () => { try { await navigator.clipboard.writeText(code); } catch (e) { const t = document.createElement('textarea'); t.value = code; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (er) {} t.remove(); } $('pgCopia').textContent = 'Copiado! Agora cole no app do banco'; setTimeout(() => { const b = $('pgCopia'); if (b) b.textContent = 'Copiar Pix copia e cola'; }, 4000); };
  sec.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => { sec.querySelectorAll('[data-pg]').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-selected', on); }); sec.querySelectorAll('[data-pp]').forEach(p => { p.hidden = p.dataset.pp !== b.dataset.pg; }); });
  const ja = $('pgJa'); if (ja) ja.onclick = () => {
    const aba = sec.querySelector('[data-pg].on'), forma = aba ? aba.dataset.pg : 'pix', valor = forma === 'cartao' && P.cartao ? P.cartao.valor : P.valor;
    if (!confirm(`Confirmar que você pagou ${brl(valor)} por ${forma === 'cartao' ? 'cartão' : 'Pix'}?`)) return;
    const inf = { forma, valor, data: hojeISO() }; LS.set('pgInf.' + (P.venc || 'x'), inf);
    enfileirar({ tipo: 'pagamento', id: 'pg-' + (P.venc || hojeISO()) + '-' + Date.now().toString(36), _v: Date.now(), data: hojeISO(), forma, valor, venc: P.venc || '' });
    sec.outerHTML = blocoPag(); ligarPag(); cardsMG(); aviso('Pagamento informado. Obrigado!');
  };
}

/* ---------- fotos de progresso ---------- */
const POS = [['frente', 'Frente'], ['lado', 'Lado'], ['costas', 'Costas'], ['outra', 'Outra']];
let FOTOS = {}, _fotoBusy = false;
function reduzirFoto(file) {
  return new Promise((ok, erro) => {
    const u = URL.createObjectURL(file), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(u); erro(new Error('imagem')); };
    img.onload = () => {
      try {
        let lado = 1280, q = 0.82, d = '';
        for (let i = 0; i < 4; i++) {
          const k = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
          const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
          const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
          d = c.toDataURL('image/jpeg', q);
          if (d.length < 900000) break;
          lado = Math.round(lado * 0.8); q -= 0.08;
        }
        URL.revokeObjectURL(u);
        if (!d.startsWith('data:image/jpeg;base64,/9j/')) return erro(new Error('formato'));
        ok({ url: d, b64: d.slice(23) });
      } catch (e) { URL.revokeObjectURL(u); erro(e); }
    };
    img.src = u;
  });
}
function ultFotos() {
  const L = (SNAP.fotos || []).map(f => f.data).concat(LS.get('fotosEnv', []).flatMap(x => Array(x.n).fill(x.data)));
  if (!L.length) return null; const d = L.sort().reverse()[0];
  const n = Math.max((SNAP.fotos || []).filter(f => f.data === d).length, LS.get('fotosEnv', []).filter(x => x.data === d).reduce((s, x) => s + x.n, 0));
  return { data: d, n };
}
function montarFotos(sec) {
  const ant = $('fts'); if (ant) ant.remove();
  const u = ultFotos();
  sec.insertAdjacentHTML('beforeend', `<section class="block fts" id="fts"><h3>Fotos de progresso</h3><p>É pelas fotos que a gente enxerga a mudança que a balança não mostra. Só a sua equipe vê.</p>
    <div class="ft-g">${POS.map(([k, t]) => `<label class="ft-s${FOTOS[k] ? ' tem' : ''}${FOTOS[k] && FOTOS[k].ok ? ' ok' : ''}" data-pos="${k}"><input type="file" accept="image/*" aria-label="Foto: ${t}"><span class="ft-i">${FOTOS[k] ? `<img src="${FOTOS[k].url}" alt="">` : '+'}</span>${t}</label>`).join('')}</div>
    <ul class="ft-dica"><li>Mesmo lugar, mesma luz e mesma roupa de sempre.</li><li>Corpo inteiro, celular na altura do umbigo.</li><li>De manhã, em jejum, se der.</li></ul>
    <button class="bt" type="button" id="ftOk" disabled>Enviar fotos</button><p class="erro" id="ftE" style="text-align:center"></p>
    ${u ? `<p class="fb-ult" style="text-align:center;margin:4px 0 0">Últimas fotos enviadas em ${esc(dataBR(u.data))} (${u.n} ${u.n === 1 ? 'foto' : 'fotos'}).</p>` : ''}</section>`);
  const box = $('fts'), bt = $('ftOk'); ligarComparar(box);
  const pend = () => POS.map(p => p[0]).filter(k => FOTOS[k] && !FOTOS[k].ok);
  const pintar = () => { const n = pend().length; bt.disabled = !n || _fotoBusy; if (!_fotoBusy) bt.textContent = n ? `Enviar ${n} ${n === 1 ? 'foto' : 'fotos'}` : 'Enviar fotos'; };
  box.querySelectorAll('.ft-s input').forEach(inp => inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0], lab = inp.closest('.ft-s'), k = lab.dataset.pos; if (!f) return;
    $('ftE').textContent = '';
    try { const r = await reduzirFoto(f); FOTOS[k] = { id: novoId(), url: r.url, b64: r.b64 }; lab.className = 'ft-s tem'; lab.querySelector('.ft-i').innerHTML = `<img src="${r.url}" alt="">`; }
    catch (e) { $('ftE').textContent = 'Não consegui abrir essa foto. Tente outra, ou tire a foto de novo.'; }
    inp.value = ''; pintar();
  }));
  bt.onclick = async () => {
    const L = pend(); if (!L.length || _fotoBusy) return;
    if (!navigator.onLine) { $('ftE').textContent = 'Sem internet. Conecte e toque em Enviar de novo.'; return; }
    _fotoBusy = true; bt.disabled = true; $('ftE').textContent = ''; let ok = 0, erro = '';
    for (let i = 0; i < L.length; i++) {
      const k = L[i], ft = FOTOS[k], lab = box.querySelector(`.ft-s[data-pos="${k}"]`);
      bt.textContent = `Enviando ${i + 1} de ${L.length}…`; lab.classList.add('indo');
      let r = '';
      try { const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao: 'foto', t: T, p: PIN, foto: { id: ft.id, data: hojeISO(), pos: k, img: ft.b64 } }) }); r = (await res.text()).trim(); }
      catch (e) { r = 'rede'; }
      lab.classList.remove('indo');
      if (r === 'ok') { await guardarFotoLocal(hojeISO(), k, ft.b64); ft.ok = true; ft.b64 = ''; lab.classList.add('ok'); ok++; continue; }
      if (r === 'codigo' || r === 'link') { _fotoBusy = false; LS.del('pin'); PIN = ''; return r === 'link' ? telaInativa() : telaPin('O código mudou. Peça o código novo ao seu coach.'); }
      erro = r === 'limite' ? 'Você já mandou muitas fotos hoje. Tente de novo amanhã.' : r === 'rede' ? 'A internet caiu no meio do envio. Toque em Enviar para mandar as que faltam.' : 'Não deu para enviar agora. Toque em Enviar para tentar de novo.';
      break;
    }
    _fotoBusy = false;
    if (ok) { const env = LS.get('fotosEnv', []); env.push({ data: hojeISO(), n: ok }); LS.set('fotosEnv', env.slice(-30)); }
    if (erro) { $('ftE').textContent = erro; return pintar(); }
    FOTOS = {};
    box.innerHTML = `<div style="text-align:center;padding:12px 0"><h3 style="font-size:19px;margin-bottom:6px">${ok === 1 ? 'Foto enviada' : ok + ' fotos enviadas'} ✓</h3><p style="color:var(--ink-2)">Chegaram para a sua equipe. Na próxima vez, repita o mesmo lugar e a mesma luz para a comparação ficar justa.</p><button class="bt ln" type="button" id="ftMais" style="margin-top:14px">Mandar outras fotos</button></div>`;
    $('ftMais').onclick = () => montarFotos(sec);
  };
  pintar();
}

/* ---------- atualizar o protocolo quando o coach mudar ---------- */
let _ultBusca = 0;
async function atualizarSnap() {
  if (!PIN || Date.now() - _ultBusca < 60000) return; _ultBusca = Date.now();
  try {
    const r = await buscar(PIN);
    if (r.ok) { const mudou = !SNAP || r.dados.pubEm !== SNAP.pubEm; SNAP = r.dados; LS.set('snap', SNAP); { const ov = $('relov'), R = SNAP.rel; if (ov && R && R.html && String(R.em || '') !== ov.dataset.em) { ov.dataset.em = String(R.em || ''); ov.querySelector('.relov-c').innerHTML = `<style>${R.css || ''}</style>${R.html}`; ov.querySelector('.relov-b b').textContent = `Relatório de ${R.n} dias`; } } if (mudou && !_fotoBusy && !Object.keys(FOTOS).length && !document.activeElement.matches('input,textarea')) { const y = scrollY; const aba = LS.get('aba', ''); montar(); if (aba && $(aba)) $(aba).checked = true; scrollTo(0, y); } }
    else if (r.erro === 'link') telaInativa();
    else if (r.erro === 'codigo') { LS.del('pin'); PIN = ''; telaPin('O código mudou. Peça o código novo ao seu coach.'); }
  } catch (e) {}
}

/* ---------- sem internet: a página fica guardada no aparelho ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));

/* ---------- início ---------- */
if (!T) telaSemLink();
else if (PIN && SNAP) { montar(); atualizarSnap(); enviarFila(); }
else if (PIN) { buscar(PIN).then(r => { if (r.ok) { SNAP = r.dados; LS.set('snap', SNAP); montar(); enviarFila(); } else if (r.erro === 'link') telaInativa(); else telaPin(); }).catch(() => telaPin('Sem internet. Conecte e tente de novo.')); }
else telaPin();
</script>
